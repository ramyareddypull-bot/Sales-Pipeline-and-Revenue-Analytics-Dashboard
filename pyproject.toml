[project]
name = "sales-pipeline-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[project.optional-dependencies]
ai = [
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
